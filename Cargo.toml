[package]
name = "voice-meter"
version = "0.3.0"
edition = "2024"
rust-version = "1.87"
description = "A tiny native macOS HUD that shows how loudly you speak in meetings"
license = "MIT"
readme = "README.md"
repository = "https://github.com/civancza/voice-meter"
keywords = ["macos", "microphone", "meter", "appkit", "meetings"]
categories = ["multimedia::audio", "gui"]
publish = false

[dependencies]
cpal = "0.16"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-foundation = "0.3"
objc2-quartz-core = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
