name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include what you expected instead. Screenshots help a lot.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: version
    attributes:
      label: Voice Meter version / commit
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model (Apple Silicon / Intel)
    validations:
      required: true
  - type: input
    id: mic
    attributes:
      label: Microphone / meeting app
      placeholder: e.g. AirPods Pro, Zoom full screen
  - type: textarea
    id: logs
    attributes:
      label: Output of ./VoiceMeter.app/Contents/MacOS/VoiceMeter or crash report
      render: text
